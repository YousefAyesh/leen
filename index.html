<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>do you miss me?</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Nunito:wght@700;900&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: #FF69B4;
      min-height: 100vh;
      font-family: 'Nunito', sans-serif;
    }

    .page {
      display: none;
      width: 100%;
      min-height: 100vh;
      padding: 24px 16px;
      text-align: center;
    }

    .page.active {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .gif-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      width: 100%;
      max-width: 560px;
      margin-bottom: 28px;
    }

    .gif-grid > div {
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 4px 16px rgba(0,0,0,0.2);
      aspect-ratio: 1 / 1;
    }

    #page1 h1 {
      font-family: 'Pacifico', cursive;
      font-size: clamp(2rem, 6vw, 3.5rem);
      color: #fff;
      text-shadow: 2px 4px 8px rgba(0,0,0,0.2);
      margin-bottom: 32px;
    }

    @media (max-width: 360px) {
      .gif-grid { grid-template-columns: 1fr; }
    }

    .btn-row {
      display: flex;
      gap: 20px;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
    }

    .btn {
      font-family: 'Nunito', sans-serif;
      font-size: 1.4rem;
      font-weight: 900;
      padding: 14px 40px;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(0,0,0,0.2);
      transition: transform 0.1s;
    }

    .btn-yes {
      background: #fff;
      color: #FF69B4;
    }

    .btn-yes:hover { transform: scale(1.06); }

    .btn-no {
      background: #c0392b;
      color: #fff;
      position: fixed;
      transition: transform 0.1s, left 0.08s, top 0.08s;
    }
  </style>
</head>
<body>
  <div id="page1" class="page active">
    <div class="gif-grid">

        </div>

      <div>
        <div class="tenor-gif-embed" data-postid="3122588929262013745" data-share-method="host" data-aspect-ratio="0.564257" data-width="100%">
          <a href="https://tenor.com/view/cat-licking-popsicle-gif-3122588929262013745">Cat Licking GIF</a>
        </div>
      </div>
      <div>
        <div class="tenor-gif-embed" data-postid="13580267959542514666" data-share-method="host" data-aspect-ratio="0.924686" data-width="100%">
          <a href="https://tenor.com/view/goth-goth-cat-black-goth-cat-cat-black-cat-gif-13580267959542514666">Goth Cat GIF</a>

    </div>
    <h1>do you miss me? 🥺</h1>
