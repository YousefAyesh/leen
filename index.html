<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>do you miss me?</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Nunito:wght@700;900&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: #FF69B4;
      min-height: 100vh;
      font-family: 'Nunito', sans-serif;
    }

    .page {
      display: none;
      width: 100%;
      min-height: 100vh;
      padding: 24px 16px;
      text-align: center;
    }

    .page.active {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .gif-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      width: 100%;
      max-width: 560px;
      margin-bottom: 28px;
    }

    .gif-grid > div {
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 4px 16px rgba(0,0,0,0.2);
      aspect-ratio: 1 / 1;
    }

    .page h1 {
      font-family: 'Pacifico', cursive;
      color: #fff;
      text-shadow: 2px 4px 8px rgba(0,0,0,0.2);
    }

    #page1 h1 {
      font-size: clamp(2rem, 6vw, 3.5rem);
      margin-bottom: 32px;
    }

    @media (max-width: 360px) {
      .gif-grid { grid-template-columns: 1fr; }
    }

    .btn-row {
      display: flex;
      gap: 20px;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
    }

    .btn {
      font-family: 'Nunito', sans-serif;
      font-size: 1.4rem;
      font-weight: 900;
      padding: 14px 40px;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(0,0,0,0.2);
      transition: transform 0.1s;
    }

    .btn-yes {
      background: #fff;
      color: #FF69B4;
    }

    .btn-yes:hover { transform: scale(1.06); }

    .btn-no {
      background: #c0392b;
      color: #fff;
      transition: transform 0.1s;
      touch-action: manipulation;
    }

    .btn-no.fleeing {
      position: fixed;
      transition: transform 0.1s, left 0.08s, top 0.08s;
    }

    .yes-page {
      gap: 24px;
    }

    .yes-page h1 {
      font-size: clamp(1.8rem, 5vw, 3rem);
    }

    .yes-gif {
      width: 100%;
      max-width: 340px;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 6px 24px rgba(0,0,0,0.25);
    }

    .dunkin-img {
      width: 100%;
      max-width: 300px;
      border-radius: 20px;
      box-shadow: 0 6px 24px rgba(0,0,0,0.25);
    }

    .dunkin-label {
      font-size: 1.3rem;
      color: #fff;
      font-weight: 900;
      text-shadow: 1px 2px 6px rgba(0,0,0,0.2);
    }

    .please-msg {
      font-family: 'Pacifico', cursive;
      font-size: clamp(1.2rem, 4vw, 1.8rem);
      color: #fff;
      text-shadow: 2px 3px 8px rgba(0,0,0,0.2);
    }

    @keyframes floatUp {
      0%   { opacity: 1; transform: translateY(0) scale(1); }
      100% { opacity: 0; transform: translateY(-120px) scale(1.4); }
    }

    .heart {
      position: fixed;
      font-size: 2rem;
      pointer-events: none;
      animation: floatUp 1.2s ease-out forwards;
      z-index: 999;
    }
  </style>
</head>
<body>
  <div id="page1" class="page active">
    <div class="gif-grid">
      <div>
        <div class="tenor-gif-embed" data-postid="4338452386513641626" data-share-method="host" data-aspect-ratio="1" data-width="100%">
          <a href="https://tenor.com/view/cat-shield-bashing-warrior-banging-gif-4338452386513641626">Cat Shield GIF</a>
        </div>
      </div>
      <div>
        <div class="tenor-gif-embed" data-postid="10000605937555107357" data-share-method="host" data-aspect-ratio="1.02049" data-width="100%">
          <a href="https://tenor.com/view/kitty-cat-cat-in-love-in-love-cat-happy-gif-10000605937555107357">Kitty Cat Meme</a>
        </div>
      </div>
      <div>
        <div class="tenor-gif-embed" data-postid="3122588929262013745" data-share-method="host" data-aspect-ratio="0.564257" data-width="100%">
          <a href="https://tenor.com/view/cat-licking-popsicle-gif-3122588929262013745">Cat Licking GIF</a>
        </div>
      </div>
      <div>
        <div class="tenor-gif-embed" data-postid="13580267959542514666" data-share-method="host" data-aspect-ratio="0.924686" data-width="100%">
          <a href="https://tenor.com/view/goth-goth-cat-black-goth-cat-cat-black-cat-gif-13580267959542514666">Goth Cat GIF</a>
        </div>
      </div>
    </div>
    <h1>do you miss me? 🥺</h1>
    <div class="btn-row">
      <button class="btn btn-yes" id="btnYes">yes 💕</button>
      <button class="btn btn-no"  id="btnNo">no</button>
    </div>
  </div>
  <script type="text/javascript" async src="https://tenor.com/embed.js"></script>
  <div id="page2" class="page yes-page">
    <h1>yay!! here is your favorite dunkin coffee ☕</h1>
    <div class="yes-gif">
      <div class="tenor-gif-embed" data-postid="5034219186050115128" data-share-method="host" data-aspect-ratio="0.995984" data-width="100%">
        <a href="https://tenor.com/view/cat-scuba-dance-gif-5034219186050115128">Cat Scuba GIF</a>
      </div>
    </div>
    <p class="dunkin-label">Medium Iced Dunkalatte 🧋</p>
    <img class="dunkin-img" src="assets/dunkin.jpeg" alt="Medium Iced Dunkalatte" />
    <p class="please-msg">please don't ignore me 🥺</p>
  </div>

  <script>
    const btnNo = document.getElementById('btnNo');

    // ── Flee helpers ───────────────────────────────────────────────────
    const FLEE_RADIUS = 130;

    function randomSafePos(bw, bh) {
      const margin = 20;
      const x = margin + Math.random() * (window.innerWidth  - bw - margin * 2);
      const y = margin + Math.random() * (window.innerHeight - bh - margin * 2);
      return { x, y };
    }

    // Button stays in normal flow (beside Yes) until first flee — then locks to fixed.
    function startFleeing() {
      if (btnNo.classList.contains('fleeing')) return;
      const rect = btnNo.getBoundingClientRect();
      btnNo.style.left  = rect.left  + 'px';
      btnNo.style.top   = rect.top   + 'px';
      btnNo.style.width = rect.width + 'px';
      btnNo.classList.add('fleeing');
    }

    // ── Desktop flee ───────────────────────────────────────────────────
    document.addEventListener('mousemove', (e) => {
      if (!document.getElementById('page1').classList.contains('active')) return;
      startFleeing();
      const rect = btnNo.getBoundingClientRect();
      const dist = Math.hypot(e.clientX - (rect.left + rect.width / 2),
                              e.clientY - (rect.top  + rect.height / 2));
      if (dist < FLEE_RADIUS) {
        const { x, y } = randomSafePos(rect.width, rect.height);
        btnNo.style.left = x + 'px';
        btnNo.style.top  = y + 'px';
      }
    });

    // ── Mobile flee ────────────────────────────────────────────────────
    btnNo.addEventListener('touchstart', (e) => {
      if (!document.getElementById('page1').classList.contains('active')) return;
      e.preventDefault();
      startFleeing();
      const rect = btnNo.getBoundingClientRect();
      const { x, y } = randomSafePos(rect.width, rect.height);
      btnNo.style.left = x + 'px';
      btnNo.style.top  = y + 'px';
    }, { passive: false });

    // ── Yes button ─────────────────────────────────────────────────────
    document.getElementById('btnYes').addEventListener('click', (e) => {
      for (let i = 0; i < 8; i++) {
        const h = document.createElement('span');
        h.className = 'heart';
        h.textContent = ['💕','💖','🩷','💗'][Math.floor(Math.random()*4)];
        const r = e.target.getBoundingClientRect();
        const cx = e.clientX || (r.left + r.width  / 2);
        const cy = e.clientY || (r.top  + r.height / 2);
        h.style.left = (cx + (Math.random()-0.5)*80) + 'px';
        h.style.top  = (cy + (Math.random()-0.5)*40) + 'px';
        document.body.appendChild(h);
        h.addEventListener('animationend', () => h.remove());
      }
      setTimeout(() => {
        btnNo.style.display = 'none';
        document.getElementById('page1').classList.remove('active');
        document.getElementById('page2').classList.add('active');
      }, 400);
    });
  </script>
</body>
</html>
